server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compresión gzip ──────────────────────────────────────────────────
    # La imagen oficial de nginx la trae APAGADA: sin esto el JS viajaba
    # completo (~740 KB el de Ant Design) y también las respuestas del
    # backend, como la lista de +1000 equipos. El texto (JS, CSS, JSON) se
    # comprime muy bien: el navegador lo descomprime solo al recibirlo.
    gzip on;
    # 1 (rápido, comprime poco) a 9 (lento, apenas comprime más): 5 es el
    # punto medio habitual.
    gzip_comp_level 5;
    # Respuestas muy chicas no valen la pena (el encabezado pesa más que lo
    # que se ahorra).
    gzip_min_length 1024;
    # Qué tipos comprimir (text/html ya se comprime siempre). Imágenes como
    # PNG o GIF no: ya vienen comprimidas.
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # Avisa a cachés intermedias que hay versión comprimida y sin comprimir.
    gzip_vary on;

    # /api/... → backend. La barra final en proxy_pass QUITA el prefijo:
    # /api/equipos llega al backend como /equipos (sus rutas reales).
    # "backend" es el nombre del servicio en docker-compose.yml: Docker lo
    # resuelve como un nombre de host dentro de su red interna.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rutas de React Router (/equipos, /vinetas...): no existen como
    # archivos en el servidor. Si no se encuentra el archivo pedido, se
    # devuelve index.html y React decide qué pantalla mostrar. Sin esto,
    # refrescar la página en /equipos daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caché del navegador ──────────────────────────────────────────────
    # /assets/ = el JS y CSS que genera `vite build`. Su nombre lleva un
    # código del contenido (ej. table-CH4AQpLl.js) que cambia en cada versión
    # nueva: el mismo nombre SIEMPRE es el mismo contenido. Por eso el
    # navegador puede guardarlo un año sin volver a preguntar ("immutable").
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Un archivo que ya no existe (de una versión anterior) da 404, no
        # index.html: si devolviera HTML, el navegador intentaría ejecutarlo
        # como JS. (main.tsx recarga la página si pasa, ver vite:preloadError.)
        try_files $uri =404;
    }

    # index.html, en cambio, NUNCA se guarda sin preguntar: es el que dice
    # qué archivos de /assets/ usar. Así, tras desplegar una versión nueva,
    # el navegador la ve en la siguiente recarga. (Las rutas de React Router
    # también terminan acá por el try_files de arriba.)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
