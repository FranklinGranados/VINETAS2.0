server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/... → backend. La barra final en proxy_pass QUITA el prefijo:
    # /api/equipos llega al backend como /equipos (sus rutas reales).
    # "backend" es el nombre del servicio en docker-compose.yml: Docker lo
    # resuelve como un nombre de host dentro de su red interna.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rutas de React Router (/equipos, /vinetas...): no existen como
    # archivos en el servidor. Si no se encuentra el archivo pedido, se
    # devuelve index.html y React decide qué pantalla mostrar. Sin esto,
    # refrescar la página en /equipos daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
