# Levanta el sistema completo: MySQL + backend (NestJS) + frontend (nginx).
#
#   docker compose up -d --build     → construir y levantar
#   docker compose ps                → ver estado
#   docker compose logs -f backend   → ver logs del backend
#   docker compose down              → detener (los datos se conservan)
#
# Las variables ${...} salen del archivo .env de esta misma carpeta
# (copiar .env.example → .env). Ver README, sección "Despliegue con Docker".

# Nombre del proyecto fijo: si no, Docker lo toma de la carpeta ("viñetas"),
# y la "ñ" no es válida en nombres de proyecto de Compose.
name: vinetas

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      TZ: America/Guatemala
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # Datos persistentes: sobreviven a `docker compose down`.
      - mysql_data:/var/lib/mysql
      # Scripts en /docker-entrypoint-initdb.d se ejecutan UNA sola vez,
      # cuando el volumen está vacío (primer arranque): crea las tablas y
      # carga las áreas/sub-áreas iniciales.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Solo para conectarse con Workbench/DBeaver desde la PC. El backend
      # no lo necesita: dentro de Docker usa mysql:3306.
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      # "Sano" = la tabla areas ya existe y responde. Un simple ping no
      # alcanza: durante el primer arranque MySQL responde antes de terminar
      # de cargar schema.sql, y el backend arrancaría sin tablas.
      test: ["CMD-SHELL", "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1 FROM vinetas.areas LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # allowPublicKeyRetrieval: MySQL 8.4 autentica con caching_sha2_password,
      # que sin SSL necesita que el cliente pida la clave pública del
      # servidor. El driver mariadb no lo hace si no se le permite ("RSA
      # public key is not available client side"). Es seguro acá porque la
      # conexión va por la red interna de Docker, no sale a la red.
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/vinetas?allowPublicKeyRetrieval=true
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-43200}
      FRONTEND_URL: http://localhost:${WEB_PORT:-8090}
      # Opcional: BD original en SQL Server (diagnóstico probar-sqlserver).
      SQLSERVER_URL: ${SQLSERVER_URL:-}
      # Hora local en los logs (sin esto el contenedor usa UTC: 6 horas
      # adelantado respecto a Guatemala) y en los cálculos de "hoy".
      TZ: ${ZONA_HORARIA:-America/Guatemala}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Guatemala}
      # NestJS colorea sus logs con códigos de terminal que, guardados en un
      # archivo o vistos en PowerShell 5, aparecen como basura ("[33m").
      # NO_COLOR es la convención estándar para desactivarlos.
      NO_COLOR: "1"
    depends_on:
      mysql:
        condition: service_healthy
    # Sin "ports": el backend NO se expone fuera de Docker. Solo lo alcanza
    # nginx (frontend) por la red interna, en /api.

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
